name: Build Desktop App (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python-arch: 'x64'
            asset-name: sndcpy++-windows-x64.zip
          - arch: x86
            python-arch: 'x86'
            asset-name: sndcpy++-windows-x86.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pillow

      - name: Generate ICO from PNG
        run: |
          python -c "from PIL import Image; img = Image.open('logo/Sndcpy++_1.png'); img.save('logo/logo.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: pyinstaller main.spec --clean --noconfirm

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/sndcpypp.exe -DestinationPath "release/${{ matrix.asset-name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset-name }}
          path: release/${{ matrix.asset-name }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.asset-name }}
          name: sndcpy++ ${{ github.ref_name }}
          generate_release_notes: false
