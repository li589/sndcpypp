name: Build Desktop App (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: pyinstaller main.spec --clean --noconfirm

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/sndcpypp.exe -DestinationPath release/sndcpypp-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sndcpypp-windows-x64
          path: release/sndcpypp-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/sndcpypp-windows-x64.zip
          name: sndcpy++ ${{ github.ref_name }}
          generate_release_notes: true
