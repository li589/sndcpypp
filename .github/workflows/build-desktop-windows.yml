name: Build Desktop App (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    # PyQt6 6.9.0 无 32 位 wheels (仅 win_amd64 / win_arm64)，故不提供 x86 构建。

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pillow

      - name: Generate ICO from PNG
        run: |
          python -c "from PIL import Image; img = Image.open('logo/Sndcpy++_1.png'); img.save('logo/logo.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: pyinstaller main.spec --clean --noconfirm

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/sndcpypp.exe -DestinationPath "release/sndcpy++-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sndcpy++-windows-x64.zip
          path: release/sndcpy++-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/sndcpy++-windows-x64.zip
          name: sndcpy++ ${{ github.ref_name }}
          generate_release_notes: false
