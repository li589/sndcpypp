name: Build Desktop App (Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64: ubuntu-latest (glibc 2.31+) 兼容 PyQt6 manylinux_2_28_x86_64 wheel
          - arch: x64
            runner: ubuntu-latest
            asset-name: sndcpy++-linux-x64.zip
          # arm64: PyQt6 6.9.0 的 aarch64 wheel 要求 manylinux_2_39 (glibc 2.39+)，
          # 必须用 ubuntu-24.04-arm 原生 ARM runner（glibc 2.39）。
          - arch: arm64
            runner: ubuntu-24.04-arm
            asset-name: sndcpy++-linux-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build with PyInstaller
        run: pyinstaller main.spec --clean --noconfirm

      - name: Package artifact
        run: |
          mkdir -p release
          cd dist && zip -r "../release/${{ matrix.asset-name }}" sndcpypp && cd ..
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset-name }}
          path: release/${{ matrix.asset-name }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.asset-name }}
          name: sndcpy++ ${{ github.ref_name }}
          generate_release_notes: false
