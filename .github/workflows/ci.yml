name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check . --exclude venv --exclude build --exclude dist --exclude 'AudioRouter/third_party' --exclude vendor

      - name: Format check with ruff
        run: ruff format --check . --exclude venv --exclude build --exclude dist --exclude 'AudioRouter/third_party' --exclude vendor

      - name: Type check with mypy
        run: mypy . --config-file pyproject.toml || true
        continue-on-error: true  # 渐进式启用：现有代码有类型注解缺口，暂不阻断 CI

      - name: Run tests
        run: python -m unittest discover -s tests -v
