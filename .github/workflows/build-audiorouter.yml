name: Build AudioRouter (cross-platform)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            cmake-args: ''
            artifact: AudioRouter-linux-x64
          - os: windows-latest
            arch: x64
            cmake-args: '-A x64'
            artifact: AudioRouter-windows-x64.exe
          - os: windows-latest
            arch: x86
            cmake-args: '-A Win32'
            artifact: AudioRouter-windows-x86.exe
          - os: macos-latest
            arch: arm64
            cmake-args: '-DCMAKE_OSX_ARCHITECTURES=arm64'
            artifact: AudioRouter-macos-arm64
          - os: macos-13
            arch: x64
            cmake-args: '-DCMAKE_OSX_ARCHITECTURES=x86_64'
            artifact: AudioRouter-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev

      - name: Configure CMake
        run: cmake -B build -S AudioRouter -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ -f build/Release/AudioRouter.exe ]; then
              cp build/Release/AudioRouter.exe "staging/${{ matrix.artifact }}"
            else
              cp build/AudioRouter.exe "staging/${{ matrix.artifact }}"
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp build/AudioRouter "staging/${{ matrix.artifact }}"
          else
            cp build/AudioRouter "staging/${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: staging/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to Release (on tag)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: sndcpy++ ${{ github.ref_name }}
          body: |
            ## sndcpy++ ${{ github.ref_name }}

            Android 音频/视频转发与设备管理桌面应用，基于 PyQt6 + scrcpy + sndcpy.apk。

            ### 下载

            | 平台 | sndcpy++ | AudioRouter |
            |------|----------|-------------|
            | Windows x64 | `sndcpy++-windows-x64.zip` | `AudioRouter-windows-x64.exe` |
            | Windows x86 | `sndcpy++-windows-x86.zip` | `AudioRouter-windows-x86.exe` |
            | macOS Apple Silicon | `sndcpy++-macos-arm64.zip` | `AudioRouter-macos-arm64` |
            | macOS Intel | `sndcpy++-macos-x64.zip` | `AudioRouter-macos-x64` |
            | Linux x64 | `sndcpy++-linux-x64.zip` | `AudioRouter-linux-x64` |

            ### 功能
            - 音频转发（sndcpy.apk + AudioRouter）
            - 视频镜像（scrcpy）
            - 文件管理（上传/下载/浏览）
            - 屏幕录制
            - 设备状态实时监控
            - ADB 调试控制台

            ### 使用方法
            1. 下载对应平台的 sndcpy++ 压缩包
            2. 解压并运行可执行文件
            3. USB 连接 Android 设备（需开启 USB 调试）
            4. 在应用中选择设备并开始音频/视频转发
          generate_release_notes: false
