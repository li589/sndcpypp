name: Build Desktop App (macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            asset-name: sndcpy++-macos-arm64.zip
          - runner: macos-13
            arch: x64
            asset-name: sndcpy++-macos-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Convert icon to .icns
        run: |
          mkdir -p logo/logo.iconset
          sips -z 1024 1024 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_512x512@2x.png
          sips -z 512 512 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_512x512.png
          sips -z 256 256 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_256x256@2x.png
          sips -z 256 256 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_256x256.png
          sips -z 128 128 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_128x128@2x.png
          sips -z 128 128 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_128x128.png
          sips -z 64 64 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_32x32@2x.png
          sips -z 32 32 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_32x32.png
          sips -z 32 32 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_16x16@2x.png
          sips -z 16 16 "logo/Sndcpy++_1.png" --out logo/logo.iconset/icon_16x16.png
          iconutil -c icns logo/logo.iconset -o logo/logo.icns
          ls -la logo/logo.icns

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build with PyInstaller
        run: pyinstaller main.spec --clean --noconfirm

      - name: Package artifact
        run: |
          mkdir -p release
          cd dist && zip -r "../release/${{ matrix.asset-name }}" sndcpypp.app && cd ..
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset-name }}
          path: release/${{ matrix.asset-name }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.asset-name }}
          name: sndcpy++ ${{ github.ref_name }}
          generate_release_notes: false
