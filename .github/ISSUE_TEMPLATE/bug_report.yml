name: 🐛 Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告 Bug！请尽量填写以下信息，帮助我们快速定位问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述遇到了什么问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 详细描述如何复现
      placeholder: |
        1. 打开程序...
        2. 选择设备...
        3. 点击...
        4. 出现错误...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 控制台日志 / 错误信息
      description: 如果有日志输出或错误弹窗，请粘贴在这里
      render: shell

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "Windows 11 23H2 / macOS 14.4 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "3.12.3"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android 设备型号
      placeholder: "Pixel 6 / Android 14"
    validations:
      required: false

  - type: dropdown
    id: version
    attributes:
      label: sndcpy++ 版本
      options:
        - 从源码构建 (main 分支)
        - v0.1.0
        - 其他 (请在描述中说明)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他有助于定位问题的上下文
