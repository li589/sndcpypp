name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请描述清楚使用场景和期望效果。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在使用中遇到了什么不便？或者缺少什么能力？
      placeholder: "每次要...的时候，都需要手动...，很不方便"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望程序怎么做？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他实现方式？为什么倾向于这个方案？

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考链接、其他上下文等
